name: Build Release Image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate registry secrets
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
        run: |
          test -n "${REGISTRY_URL}" || { echo "REGISTRY_URL is not configured."; exit 1; }
          test -n "${REGISTRY_USER}" || { echo "REGISTRY_USER is not configured."; exit 1; }
          test -n "${REGISTRY_PASS}" || { echo "REGISTRY_PASS is not configured."; exit 1; }

      - name: Build and push release image
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASS: ${{ secrets.REGISTRY_PASS }}
        run: ./build_and_push.sh "${{ github.event.release.tag_name }}"
