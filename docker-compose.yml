services:
  cvm_api:
    build:
      context: .
      target: development    
    container_name: cvm_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007 --workers ${API_WORKERS:-2}
    ports:
      - "8007:8007"
    env_file:
      - .env
    volumes:
      - .:/app
      - /Volumes/SSD-1T/TEMP_DATA_TUCANO:/Volumes/SSD-1T/TEMP_DATA_TUCANO
