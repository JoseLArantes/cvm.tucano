{{- if .Values.controlWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tucano-cvm.fullname" . }}-control-worker
  labels:
    {{- include "tucano-cvm.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-worker
spec:
  replicas: {{ .Values.controlWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "tucano-cvm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-worker
  template:
    metadata:
      labels:
        {{- include "tucano-cvm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-worker
      {{- with .Values.controlWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.controlWorker.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "tucano-cvm.configMapName" . }}
            - secretRef:
                name: {{ include "tucano-cvm.appSecretName" . }}
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tucano-cvm.appSecretName" . }}
                  key: TUCANO_CVM_TOKEN
            - name: INGESTION_CONTROL_WORKER_CONCURRENCY
              value: {{ .Values.controlWorker.concurrency | quote }}
            {{- range $key, $val := .Values.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $val.secretName }}
                  key: {{ $val.secretKey }}
            {{- end }}
          resources:
            {{- toYaml .Values.controlWorker.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "tucano-cvm.fullname" . }}-data{{ end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
