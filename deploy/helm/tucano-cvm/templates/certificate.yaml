{{- if and .Values.certManager.enabled .Values.httpProxy.enabled .Values.httpProxy.tls.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.httpProxy.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tucano-cvm.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.httpProxy.tls.secretName }}
  issuerRef:
    kind: {{ .Values.certManager.issuerRef.kind | quote }}
    name: {{ .Values.certManager.issuerRef.name | quote }}
  dnsNames:
    {{- if .Values.certManager.dnsNames }}
    {{- toYaml .Values.certManager.dnsNames | nindent 4 }}
    {{- else }}
    - {{ .Values.httpProxy.fqdn | quote }}
    {{- end }}
{{- end }}
