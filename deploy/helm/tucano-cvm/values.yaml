# Default values for tucano-cvm.

image:
  repository: registry.beakcloud.com/tucano-cvm
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: registry-cred

nameOverride: ""
fullnameOverride: ""

rollout:
  type: deployment
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  argo:
    steps:
      - setWeight: 20
      - pause:
          duration: 10s
      - setWeight: 50
      - pause:
          duration: 10s

api:
  replicaCount: 1
  command:
    - uvicorn
    - app.main:app
    - --host
    - 0.0.0.0
    - --port
    - "8007"
  resources: {}
  podAnnotations: {}

worker:
  enabled: true
  replicaCount: 1
  command:
    - sh
    - -c
    - "celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 -Ofair -Q ${INGESTION_QUEUE_NAME:-ingestion},${INGESTION_CONTROL_QUEUE_NAME:-ingestion_control},celery"
  resources: {}
  podAnnotations: {}

materializationWorker:
  enabled: true
  replicaCount: 1
  command:
    - sh
    - -c
    - "celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 -Ofair -Q ${ANALISE_MATERIALIZACAO_QUEUE_NAME:-analise_materializacao}"
  resources: {}
  podAnnotations: {}

beat:
  enabled: true
  replicaCount: 1
  command:
    - sh
    - -c
    - "python -m app.worker.bootstrap && celery -A app.worker.celery_app beat --loglevel=info"
  resources: {}
  podAnnotations: {}

env:
  CVM_BASE_URL: "https://dados.cvm.gov.br/dados"
  LOG_LEVEL: "INFO"
  AMBIENTE: "desenvolvimento"
  ENABLE_PROMETHEUS_METRICS: "false"
  ANOS_INICIAIS_DFP: ""
  ANOS_INICIAIS_ITR: ""
  ANOS_INICIAIS_FRE: ""
  ANOS_INICIAIS_FCA: ""
  ANOS_INICIAIS_IPE: ""
  ANOS_INICIAIS_VLMO: ""
  ANOS_INICIAIS_CGVN: ""
  INGESTION_PROMOTE_ENABLED: "true"
  INGESTION_PROVISIONAL_COMPANY_ENABLED: "false"
  INGESTION_MAX_RETRIES: "5"
  INGESTION_RETRY_BACKOFF_MAX_SECONDS: "600"
  INGESTION_COMPANY_MISSING_MAX_RATIO: "0.10"
  ANALISE_MATERIALIZACAO_CHUNK_SIZE: "25"
  ANALISE_MATERIALIZACAO_MAX_ACTIVE_CAMPAIGNS: "1"
  ANALISE_MATERIALIZACAO_QUEUE_NAME: "analise_materializacao"
  ANALISE_MATERIALIZACAO_DEDUP_WINDOW_SECONDS: "0"
  INGESTION_STAGE_BATCH_SIZE: "5000"
  INGESTION_PROMOTE_BATCH_SIZE: "5000"
  STORAGE_DIR: "data/storage"
  INGESTION_V2_ENABLED: "true"
  INGESTION_V2_PROMOTE_ENABLED: "true"
  INGESTION_DUCKDB_STAGING_ENABLED: "true"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "1"
  CELERY_WORKER_MAX_MEMORY_PER_CHILD_KB: "1500000"
  ANALISE_MATERIALIZACAO_MAX_ACTIVE_CHUNKS_PER_CAMPAIGN: "10"
  INGESTION_MAX_ACTIVE_MEMBERS_PER_PARENT: "1"
  BACKEND_CORS_ORIGINS: http://127.0.0.1:8110,http://127.0.0.1:8010,https://portal.swaggerhub.com,https://cvm.tucano.beakcloud.com,https://cvm.companhias.tucano.beakcloud.com
  API_URL: https://cvm.tucano.beakcloud.com
  MCP_HTTP_ENABLED: "true"
  MCP_HTTP_REQUIRE_BEARER: "true"
  MCP_HTTP_ALLOWED_HOSTS: "cvm.tucano.beakcloud.com,cvm.tucano.beakcloud.com:443"
  MCP_HTTP_ALLOWED_ORIGINS: "https://cvm.tucano.beakcloud.com"
  MCP_PROFILE: "analyst"
  MCP_REQUIRE_TOKEN: "true"
  MCP_MAX_ROWS: "50"
  MCP_MAX_PERIODS: "20"
  MCP_TOOL_TIMEOUT_SECONDS: "30"
  MCP_INCLUDE_RAW_DEFAULT: "false"
  PUBLIC_COMPANIES_CVM: "23264,22616,19348,4170,9512"

appSecret:
  name: "cvm-secret"

secretEnv: {}

service:
  type: ClusterIP
  port: 8110
  targetPort: 8007

httpProxy:
  enabled: true
  fqdn: "cvm.tucano.beakcloud.com"
  annotations: {}
  tls:
    enabled: true
    secretName: "tucano-cvm-tls"
    minimumProtocolVersion: "1.2"
  responseTimeout: "60s"
  mcpResponseTimeout: "300s"
  retryPolicy:
    enabled: false
    count: 2
    perTryTimeout: "10s"
  loadBalancerPolicy: "RoundRobin"

certManager:
  enabled: false
  issuerRef:
    kind: "ClusterIssuer"
    name: "letsencrypt-prod"
  dnsNames: []

persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteMany
  size: 10Gi
  mountPath: /app/data

migration:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
